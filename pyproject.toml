[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipper-academy"
version = "0.1.0"
description = "Clipper Academy - AI-powered video clip generation platform"
readme = "README.md"
requires-python = ">=3.8.1"
license = {text = "MIT"}
authors = [
    {name = "Clipper Academy Team"}
]
keywords = ["video", "ai", "clips", "fastapi", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # FastAPI and Web Framework
    "fastapi[all]",
    "uvicorn[standard]",
    "python-multipart",
    "aiofiles",
    "httpx<0.28",
    
    # AI and Machine Learning
    "openai",
    "opencv-python",
    "numpy",
    "ultralytics",  # YOLOv8 and above
    
    # HTTP and Network
    "requests",
    
    # Environment and Configuration
    "python-dotenv",
    
    # Data Processing and Util
    "Pillow==10.1.0",
    
    # Video Processing
    "ffmpeg-python==0.2.0",
    
    # Social Media Content Downloading
    "yt-dlp==2023.11.16",
    
    # Social Media APIs
    "tiktok-api==0.10.5",
    "instagram-private-api==1.6.0",
    "google-api-python-client==2.108.0",
    "google-auth-oauthlib==1.1.0",
    "google-auth-httplib2==0.1.1",
    
    # Type Annotations
    "typing-extensions==4.8.0",
]

[project.optional-dependencies]
dev = [
    # Development and Testing
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-mock==3.12.0",
    
    # Code Quality
    "black==23.11.0",
    "isort==5.12.0",
    "flake8==6.1.0",
]

prod = [
    # Production Server
    "gunicorn==21.2.0",
]

[project.scripts]
clipper-academy = "app.main:main"

[project.urls]
Homepage = "https://github.com/your-org/clipper-academy"
Repository = "https://github.com/your-org/clipper-academy"
Documentation = "https://github.com/your-org/clipper-academy/docs"

# Build configuration to handle the app directory structure
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--asyncio-mode=auto",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "opencv-python.*",
    "cv2.*",
    "PIL.*",
    "Pillow.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py38"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.ruff.isort]
known-first-party = ["app"] 